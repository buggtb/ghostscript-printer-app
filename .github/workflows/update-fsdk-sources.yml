name: Update FSDK sources

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: update-fsdk-sources
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Track sources and synchronize metadata
        run: scripts/update-fsdk-sources.py --update
      - name: Check for updates
        id: changes
        run: |
          if git diff --quiet -- VERSION README.md elements; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify CUPS patch compatibility
        if: steps.changes.outputs.changed == 'true'
        run: just verify-cups-patch-chain
      - name: Fetch updated sources with retries
        if: steps.changes.outputs.changed == 'true'
        run: just fetch
      - name: Verify updated appliance
        if: steps.changes.outputs.changed == 'true'
        run: just verify
      - name: Mint Mergeraptor token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
      - name: Commit and propose atomic update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bot_email='267480593+mergeraptor[bot]@users.noreply.github.com'
          git config user.name 'mergeraptor[bot]'
          git config user.email "$bot_email"

          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          remote="https://github.com/${REPOSITORY}.git"
          auth_git() {
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" "$@"
          }

          # Find a proposal branch that is safe to reuse: walk auto/update-fsdk-sources,
          # -2, -3, ... and reuse the first one that either does not exist yet, or whose
          # current tip was produced entirely by the bot (author AND committer, so an
          # amend or rebase by a reviewer is still detected even though it preserves
          # the original author). Any branch owned by someone else is skipped, not
          # overwritten, and a fresh numbered branch is opened instead.
          base_branch=auto/update-fsdk-sources
          branch=""
          remote_head=""
          conflict=false
          n=1
          while :; do
            if [[ $n -eq 1 ]]; then
              candidate="$base_branch"
            else
              candidate="${base_branch}-${n}"
              conflict=true
            fi
            head="$(git ls-remote "$remote" "refs/heads/$candidate" | cut -f1)"
            if [[ -z "$head" ]]; then
              branch="$candidate"
              break
            fi
            auth_git fetch "$remote" "$candidate"
            author_email="$(git log -1 --format='%ae' FETCH_HEAD)"
            committer_email="$(git log -1 --format='%ce' FETCH_HEAD)"
            if [[ "$author_email" == "$bot_email" && "$committer_email" == "$bot_email" ]]; then
              branch="$candidate"
              remote_head="$head"
              break
            fi
            n=$((n + 1))
            if [[ $n -gt 50 ]]; then
              printf '::error::Could not find a bot-owned or free proposal branch after 50 attempts.\n'
              exit 1
            fi
          done

          git switch --create "$branch"
          git add VERSION README.md elements
          git commit -m 'chore(deps): update FSDK appliance sources'

          if [[ -n "$remote_head" ]]; then
            # Reuse of a bot-owned branch: atomically refuse the push if the remote
            # head has moved since we inspected it (e.g. a concurrent human edit,
            # amend, or rebase landed between the ownership check and the push).
            if ! auth_git push --force-with-lease="$branch:$remote_head" "$remote" "HEAD:refs/heads/$branch"; then
              printf '::error::Refusing to force-push %s: its head moved since inspection, which looks like a reviewer edit landed concurrently. Re-run this workflow once the branch settles.\n' "$branch"
              exit 1
            fi
          else
            auth_git push "$remote" "HEAD:refs/heads/$branch"
          fi

          if [[ "$conflict" == "true" ]]; then
            printf '::warning::%s has commits not owned by mergeraptor[bot] (author or committer differs); a reviewer appears to have amended or rebased it. Reused/opened proposal branch %s instead of overwriting it.\n' "$base_branch" "$branch"
            if existing="$(gh pr list --head "$base_branch" --state open --json number --jq '.[0].number')" && [[ -n "$existing" ]]; then
              gh pr comment "$existing" --body "A new scheduled FSDK source update was proposed on \`$branch\` instead of updating this branch, because this branch has commits not owned by mergeraptor[bot] (author or committer differs — a reviewer appears to have amended or rebased it). This PR was left untouched to avoid a destructive overwrite."
            fi
          fi

          if existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" && [[ -n "$existing" ]]; then
            printf 'Updated dependency PR #%s\n' "$existing"
          else
            body='Automated atomic update of the freedesktop-sdk junction and repository-owned BuildStream sources. The workflow completed the CUPS patch-chain gate and full appliance verification before opening this PR. Auto-merge is intentionally disabled.'
            if [[ "$conflict" == "true" ]]; then
              body="$body"$'\n\n'"This proposal branch was reused or opened fresh because an earlier \`$base_branch\`-numbered branch had commits not owned by mergeraptor[bot], so it was left untouched instead of being force-pushed over."
            fi
            gh pr create \
              --base testing \
              --head "$branch" \
              --title 'chore(deps): update FSDK appliance sources' \
              --body "$body"
          fi
